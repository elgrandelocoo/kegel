<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<meta name="theme-color" content="#09090d">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<meta name="apple-mobile-web-app-title"
content="Kegel Coach">

<title>Kegel Coach</title>


<style>

/* =========================================
   BASIC
========================================= */

* {
    box-sizing: border-box;
}

html {

    width: 100%;
    height: 100%;

    background: #09090d;
}


body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background:
        radial-gradient(
            circle at 50% -10%,
            #3d254c 0%,
            #20182b 30%,
            #111118 65%,
            #07070a 100%
        );

    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        sans-serif;

    overflow: hidden;
}


/* =========================================
   APP
========================================= */

.app {

    width: 100%;

    min-height: 100dvh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding:
        calc(env(safe-area-inset-top) + 15px)
        20px
        calc(env(safe-area-inset-bottom) + 15px)
        20px;
}


.content {

    width: 100%;

    max-width: 520px;

    text-align: center;
}


/* =========================================
   HEADER
========================================= */

.icon {

    font-size: 46px;

    line-height: 1;

    margin-bottom: 12px;

    animation:
        breathe 4s ease-in-out infinite;
}


@keyframes breathe {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.08);
    }
}


.title {

    margin: 0;

    font-size: 36px;

    font-weight: 700;

    letter-spacing: 1px;
}


.subtitle {

    margin-top: 6px;

    color:
        rgba(255,255,255,0.48);

    font-size: 13px;

    letter-spacing: 2px;

    text-transform: uppercase;
}


/* =========================================
   WORKOUT SELECTION
========================================= */

.selection-card {

    margin-top: 24px;

    padding: 20px;

    border-radius: 25px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.09),
            rgba(255,255,255,0.035)
        );

    border:
        1px solid
        rgba(255,255,255,0.09);

    box-shadow:
        0 25px 60px
        rgba(0,0,0,0.30);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);
}


.selection-title {

    font-size: 11px;

    letter-spacing: 3px;

    text-transform: uppercase;

    color:
        rgba(255,255,255,0.40);

    margin-bottom: 14px;
}


/* =========================================
   WORKOUT BOXES
========================================= */

.workout-options {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;
}


.workout-option {

    padding:
        15px
        7px
        13px;

    border-radius: 17px;

    border:
        1px solid
        rgba(255,255,255,0.08);

    background:
        rgba(0,0,0,0.16);

    color: white;

    cursor: pointer;

    transition:
        transform 0.15s ease,
        background 0.15s ease,
        border 0.15s ease;
}


.workout-option.selected {

    background:
        rgba(255,255,255,0.13);

    border:
        1px solid
        rgba(255,255,255,0.30);

    box-shadow:
        inset 0 0 20px
        rgba(255,255,255,0.03);
}


.workout-option:active {

    transform:
        scale(0.96);
}


.option-number {

    font-size: 10px;

    color:
        rgba(255,255,255,0.40);

    letter-spacing: 1px;
}


.option-name {

    margin-top: 6px;

    font-size: 14px;

    font-weight: 650;
}


.option-time {

    margin-top: 5px;

    font-size: 10px;

    color:
        rgba(255,255,255,0.40);
}


/* =========================================
   SELECTED WORKOUT INFO
========================================= */

.workout-info {

    margin-top: 18px;
}


.workout-name {

    font-size: 25px;

    font-weight: 700;
}


.workout-description {

    margin-top: 7px;

    font-size: 13px;

    line-height: 1.45;

    color:
        rgba(255,255,255,0.52);
}


.duration {

    margin-top: 9px;

    font-size: 12px;

    color:
        rgba(255,255,255,0.38);
}


/* =========================================
   START BUTTON
========================================= */

.start-button {

    width: 100%;

    margin-top: 18px;

    padding: 16px;

    border: none;

    border-radius: 18px;

    background: white;

    color: #111;

    font-size: 16px;

    font-weight: 650;

    cursor: pointer;

    box-shadow:
        0 12px 30px
        rgba(0,0,0,0.25);

    transition:
        transform 0.15s ease;
}


.start-button:active {

    transform:
        scale(0.97);
}


/* =========================================
   WORKOUT SCREEN
========================================= */

.workout-screen {

    display: none;

    width: 100%;

    text-align: center;
}


.phase-label {

    font-size: 12px;

    letter-spacing: 3px;

    text-transform: uppercase;

    color:
        rgba(255,255,255,0.42);
}


.exercise-name {

    margin-top: 13px;

    font-size: 29px;

    font-weight: 700;
}


.instruction {

    margin-top: 9px;

    min-height: 48px;

    font-size: 14px;

    line-height: 1.5;

    color:
        rgba(255,255,255,0.60);
}


/* =========================================
   TIMER
========================================= */

.timer-circle {

    width: 220px;

    height: 220px;

    margin:
        28px
        auto
        22px;

    border-radius: 50%;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,0.09),
            rgba(255,255,255,0.025)
        );

    border:
        1px solid
        rgba(255,255,255,0.10);

    box-shadow:

        0 20px 50px
        rgba(0,0,0,0.35),

        inset 0 0 40px
        rgba(255,255,255,0.025);

    transition:
        transform 0.2s ease;
}


.timer-circle.active {

    transform:
        scale(1.025);
}


.timer {

    font-size: 72px;

    font-weight: 650;

    line-height: 1;

    font-variant-numeric:
        tabular-nums;
}


.timer-small {

    margin-top: 9px;

    font-size: 10px;

    letter-spacing: 2px;

    text-transform: uppercase;

    color:
        rgba(255,255,255,0.35);
}


/* =========================================
   WORKOUT TOTAL REMAINING
========================================= */

.remaining-label {

    font-size: 10px;

    letter-spacing: 2px;

    text-transform: uppercase;

    color:
        rgba(255,255,255,0.35);

    margin-bottom: 3px;
}


.remaining-time {

    font-size: 20px;

    font-weight: 600;

    font-variant-numeric:
        tabular-nums;

    letter-spacing: 1px;

    color:
        rgba(255,255,255,0.85);

    margin-bottom: 9px;
}


/* =========================================
   PROGRESS
========================================= */

.progress-text {

    font-size: 11px;

    color:
        rgba(255,255,255,0.40);

    margin-top: 9px;
}


.progress-bar {

    width: 100%;

    height: 5px;

    margin-top: 8px;

    border-radius: 10px;

    background:
        rgba(255,255,255,0.08);

    overflow: hidden;
}


.progress-fill {

    height: 100%;

    width: 0%;

    border-radius: 10px;

    background:
        rgba(255,255,255,0.75);

    transition:
        width 0.3s linear;
}


/* =========================================
   CONTROLS
========================================= */

.controls {

    display: flex;

    gap: 10px;

    margin-top: 20px;
}


.control-button {

    flex: 1;

    padding: 13px;

    border:
        1px solid
        rgba(255,255,255,0.10);

    border-radius: 15px;

    background:
        rgba(255,255,255,0.06);

    color: white;

    font-size: 14px;

    cursor: pointer;
}


/* =========================================
   FINISHED
========================================= */

.finished {

    display: none;

    text-align: center;
}


.finished-heart {

    font-size: 65px;

    margin-bottom: 15px;
}


.finished-title {

    font-size: 31px;

    font-weight: 700;
}


.finished-text {

    margin-top: 10px;

    color:
        rgba(255,255,255,0.50);

    line-height: 1.5;
}


/* =========================================
   SMALL PHONES
========================================= */

@media (max-width: 370px) {

    .title {
        font-size: 31px;
    }

    .timer-circle {
        width: 190px;
        height: 190px;
    }

    .timer {
        font-size: 62px;
    }

    .exercise-name {
        font-size: 26px;
    }

    .selection-card {
        padding: 16px;
    }

}


/* =========================================
   LANDSCAPE
========================================= */

@media (orientation: landscape) {

    .app {

        align-items: flex-start;

        overflow-y: auto;

        height: auto;

        min-height: 100dvh;
    }

    .content {

        margin-top: 25px;

        margin-bottom: 25px;
    }
}

</style>

</head>


<body>


<div class="app">

<div class="content">


<!-- ======================================
     HOME
======================================= -->

<div id="homeScreen">


    <div class="icon">
        🧘
    </div>


    <h1 class="title">
        Kegel Coach
    </h1>


    <div class="subtitle">
        Pelvic floor training
    </div>


    <div class="selection-card">


        <div class="selection-title">
            Choose your workout
        </div>


        <div
            class="workout-options"
            id="workoutOptions">
        </div>


        <div class="workout-info">


            <div
                class="workout-name"
                id="todayName">
            </div>


            <div
                class="workout-description"
                id="todayDescription">
            </div>


            <div
                class="duration"
                id="todayDuration">
            </div>


        </div>


        <button
            class="start-button"
            onclick="startWorkout()">

            Start Workout

        </button>


    </div>

</div>


<!-- ======================================
     WORKOUT
======================================= -->

<div
    class="workout-screen"
    id="workoutScreen">


    <div
        class="phase-label"
        id="phaseLabel">
    </div>


    <div
        class="exercise-name"
        id="exerciseName">
    </div>


    <div
        class="instruction"
        id="instruction">
    </div>


    <div
        class="timer-circle"
        id="timerCircle">


        <div
            class="timer"
            id="timer">
            0
        </div>


        <div class="timer-small">
            seconds
        </div>


    </div>


    <!-- TOTAL WORKOUT COUNTDOWN -->

    <div class="remaining-label">
        Workout remaining
    </div>


    <div
        class="remaining-time"
        id="remainingTime">

        00:00

    </div>


    <!-- PROGRESS -->

    <div
        class="progress-text"
        id="progressText">
    </div>


    <div class="progress-bar">

        <div
            class="progress-fill"
            id="progressFill">
        </div>

    </div>


    <div class="controls">


        <button
            class="control-button"
            onclick="togglePause()"
            id="pauseButton">

            Pause

        </button>


        <button
            class="control-button"
            onclick="stopWorkout()">

            Stop

        </button>


    </div>


</div>


<!-- ======================================
     FINISHED
======================================= -->

<div
    class="finished"
    id="finishedScreen">


    <div class="finished-heart">
        ❤️
    </div>


    <div class="finished-title">
        Workout complete
    </div>


    <div class="finished-text">
        Nice work.<br>
        Quality contractions and complete relaxation matter more than rushing.
    </div>


    <button
        class="start-button"
        onclick="showHome()">

        Back to Workouts

    </button>


</div>


</div>

</div>



<script>


/* =========================================
   WORKOUT DATABASE

   All sessions are intentionally short.

   "contract" =
   pelvic floor squeeze + lift

   "relax" =
   complete release

   "reverse" =
   gentle pelvic-floor relaxation
   with inhalation

   No long 30-second breaks.
========================================= */


const workouts = [

/* =========================================
   WORKOUT 1
   STRENGTH
========================================= */

{
    name: "Strength",

    shortName: "Strength",

    description:
        "Long controlled holds followed by fast contractions and release.",

    phases: [

        /*
         * 8 × 8-second holds
         * 5-second relaxation
         */

        {
            type: "contract",

            name: "Strong Hold",

            instruction:
                "Squeeze and lift. Keep breathing normally.",

            seconds: 8,

            repeats: 8,

            rest: 5
        },


        /*
         * 10 quick contractions
         */

        {
            type: "quick",

            name: "Quick Lift",

            instruction:
                "Quick squeeze and lift, then completely release.",

            seconds: 1,

            repeats: 10,

            rest: 2
        },


        /*
         * Reverse Kegel / relaxation
         */

        {
            type: "reverse",

            name: "Reverse Kegel",

            instruction:
                "Inhale slowly and gently let the pelvic floor soften and release.",

            seconds: 6,

            repeats: 4,

            rest: 3
        }

    ]
},


/* =========================================
   WORKOUT 2
   CONTROL
========================================= */

{
    name: "Control",

    shortName: "Control",

    description:
        "Progressive holds that build control without long recovery periods.",

    phases: [

        /*
         * Progressive holds
         *
         * 5 sec
         * 6 sec
         * 7 sec
         * 8 sec
         * 9 sec
         */

        {
            type: "contract",

            name: "Progressive Hold",

            instruction:
                "Squeeze and lift at a controlled intensity. Keep breathing.",

            seconds: 5,

            repeats: 1,

            rest: 4
        },

        {
            type: "contract",

            name: "Progressive Hold",

            instruction:
                "Squeeze and lift. Stay relaxed everywhere else.",

            seconds: 6,

            repeats: 1,

            rest: 4
        },

        {
            type: "contract",

            name: "Progressive Hold",

            instruction:
                "Maintain a strong but controlled lift.",

            seconds: 7,

            repeats: 1,

            rest: 4
        },

        {
            type: "contract",

            name: "Progressive Hold",

            instruction:
                "Keep breathing normally while holding.",

            seconds: 8,

            repeats: 1,

            rest: 4
        },

        {
            type: "contract",

            name: "Progressive Hold",

            instruction:
                "Final long hold. Do not strain or hold your breath.",

            seconds: 9,

            repeats: 1,

            rest: 4
        },


        /*
         * Quick contractions
         */

        {
            type: "quick",

            name: "Quick Response",

            instruction:
                "Fast squeeze, immediate full release.",

            seconds: 1,

            repeats: 10,

            rest: 2
        },


        /*
         * Reverse breathing
         */

        {
            type: "reverse",

            name: "Release & Breathe",

            instruction:
                "Inhale gently. Imagine the pelvic floor widening and softening.",

            seconds: 6,

            repeats: 5,

            rest: 3
        }

    ]
},


/* =========================================
   WORKOUT 3
   ENDURANCE
========================================= */

{
    name: "Endurance",

    shortName: "Endurance",

    description:
        "Longer holds with a fast-response finish and controlled release.",

    phases: [

        /*
         * 6 × 10-second holds
         */

        {
            type: "contract",

            name: "10 Second Hold",

            instruction:
                "Lift and hold. Continue breathing normally.",

            seconds: 10,

            repeats: 6,

            rest: 5
        },


        /*
         * 10 quick contractions
         */

        {
            type: "quick",

            name: "Fast Contractions",

            instruction:
                "Squeeze quickly and let go completely after each one.",

            seconds: 1,

            repeats: 10,

            rest: 2
        },


        /*
         * Reverse Kegel breathing
         */

        {
            type: "reverse",

            name: "Deep Release",

            instruction:
                "Inhale slowly and allow the pelvic floor to lengthen and relax.",

            seconds: 8,

            repeats: 5,

            rest: 4
        }

    ]
}

];


/* =========================================
   VARIABLES
========================================= */

let selectedWorkout = 0;

let currentWorkout = null;

let steps = [];

let currentStep = 0;

let secondsLeft = 0;

let totalSeconds = 0;

let remainingWorkoutSeconds = 0;

let timer = null;

let paused = false;


/* =========================================
   BUILD WORKOUT STEPS
========================================= */

function buildSteps(workout) {

    const result = [];


    workout.phases.forEach(
        phase => {


            const repetitions =
                phase.repeats || 1;


            for (
                let i = 1;
                i <= repetitions;
                i++
            ) {


                /*
                 * Exercise step
                 */

                result.push({

                    type:
                        phase.type,

                    name:
                        phase.name,

                    instruction:
                        phase.instruction,

                    seconds:
                        phase.seconds,

                    repetition:
                        i,

                    repetitions:
                        repetitions
                });


                /*
                 * Short relaxation
                 * between repetitions.
                 *
                 * No long breaks.
                 */

                if (
                    i < repetitions
                ) {

                    result.push({

                        type:
                            "rest",

                        name:
                            "Fully Relax",

                        instruction:
                            "Release completely. Breathe normally.",

                        seconds:
                            phase.rest,

                        repetition:
                            i,

                        repetitions:
                            repetitions
                    });

                }

            }

        }
    );


    return result;
}


/* =========================================
   CALCULATE TOTAL LENGTH
========================================= */

function calculateWorkoutLength(workout) {

    let total = 0;


    workout.phases.forEach(
        phase => {

            const repetitions =
                phase.repeats || 1;


            total +=
                phase.seconds *
                repetitions;


            if (
                repetitions > 1
            ) {

                total +=
                    phase.rest *
                    (
                        repetitions - 1
                    );
            }

        }
    );


    return total;
}


/* =========================================
   FORMAT TIME
========================================= */

function formatTime(seconds) {

    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        seconds % 60;


    return (

        String(minutes)
        .padStart(2, "0")

        +

        ":"

        +

        String(secs)
        .padStart(2, "0")

    );
}


/* =========================================
   SHOW WORKOUT OPTIONS
========================================= */

function renderWorkoutOptions() {

    const container =
        document.getElementById(
            "workoutOptions"
        );


    container.innerHTML = "";


    workouts.forEach(
        (workout, index) => {


            const button =
                document.createElement(
                    "div"
                );


            button.className =
                "workout-option";


            if (
                index ===
                selectedWorkout
            ) {

                button.classList.add(
                    "selected"
                );
            }


            button.innerHTML =

                `
                <div class="option-number">
                    WORKOUT ${index + 1}
                </div>

                <div class="option-name">
                    ${workout.shortName}
                </div>

                <div class="option-time">
                    ${formatTime(
                        calculateWorkoutLength(
                            workout
                        )
                    )}
                </div>
                `;


            button.onclick =
                function() {

                    selectedWorkout =
                        index;

                    renderWorkoutOptions();

                    updateSelectedWorkout();

                };


            container.appendChild(
                button
            );

        }
    );
}


/* =========================================
   UPDATE SELECTED WORKOUT
========================================= */

function updateSelectedWorkout() {

    const workout =
        workouts[
            selectedWorkout
        ];


    document.getElementById(
        "todayName"
    ).textContent =
        workout.name;


    document.getElementById(
        "todayDescription"
    ).textContent =
        workout.description;


    document.getElementById(
        "todayDuration"
    ).textContent =

        "Duration · "
        +
        formatTime(
            calculateWorkoutLength(
                workout
            )
        );

}


/* =========================================
   START WORKOUT
========================================= */

function startWorkout() {

    clearInterval(timer);


    currentWorkout =
        workouts[
            selectedWorkout
        ];


    steps =
        buildSteps(
            currentWorkout
        );


    currentStep = 0;


    totalSeconds =
        calculateWorkoutLength(
            currentWorkout
        );


    remainingWorkoutSeconds =
        totalSeconds;


    paused = false;


    document.getElementById(
        "homeScreen"
    ).style.display =
        "none";


    document.getElementById(
        "finishedScreen"
    ).style.display =
        "none";


    document.getElementById(
        "workoutScreen"
    ).style.display =
        "block";


    document.getElementById(
        "pauseButton"
    ).textContent =
        "Pause";


    loadStep();


    startTimer();

}


/* =========================================
   LOAD STEP
========================================= */

function loadStep() {

    const step =
        steps[
            currentStep
        ];


    if (!step) {

        finishWorkout();

        return;
    }


    secondsLeft =
        step.seconds;


    updateStepDisplay();

}


/* =========================================
   UPDATE STEP DISPLAY
========================================= */

function updateStepDisplay() {

    const step =
        steps[
            currentStep
        ];


    let label =
        "EXERCISE";


    if (
        step.type ===
        "contract"
    ) {

        label =
            "CONTRACT • HOLD";

    }


    else if (
        step.type ===
        "quick"
    ) {

        label =
            "QUICK CONTRACTION";

    }


    else if (
        step.type ===
        "reverse"
    ) {

        label =
            "RELEASE • INHALE";

    }


    else if (
        step.type ===
        "rest"
    ) {

        label =
            "RELAX";
    }


    document.getElementById(
        "phaseLabel"
    ).textContent =
        label;


    document.getElementById(
        "exerciseName"
    ).textContent =
        step.name;


    document.getElementById(
        "instruction"
    ).textContent =
        step.instruction;


    document.getElementById(
        "timer"
    ).textContent =
        secondsLeft;


    if (
        step.type ===
        "rest"
    ) {

        document.getElementById(
            "progressText"
        ).textContent =
            "Recovery";

    }

    else {

        document.getElementById(
            "progressText"
        ).textContent =

            "Repetition "
            +
            step.repetition
            +
            " / "
            +
            step.repetitions;

    }


    updateProgress();

}


/* =========================================
   START TIMER
========================================= */

function startTimer() {

    clearInterval(timer);


    timer =
        setInterval(
            function() {


                if (paused) {
                    return;
                }


                secondsLeft--;

                remainingWorkoutSeconds--;


                if (
                    secondsLeft < 0
                ) {

                    secondsLeft =
                        0;
                }


                if (
                    remainingWorkoutSeconds
                    < 0
                ) {

                    remainingWorkoutSeconds =
                        0;
                }


                document.getElementById(
                    "timer"
                ).textContent =
                    secondsLeft;


                document.getElementById(
                    "remainingTime"
                ).textContent =

                    formatTime(
                        remainingWorkoutSeconds
                    );


                updateProgress();

                pulseTimer();


                if (
                    secondsLeft <= 0
                ) {

                    nextStep();

                }


            },
            1000
        );
}


/* =========================================
   NEXT STEP
========================================= */

function nextStep() {

    clearInterval(timer);


    currentStep++;


    if (
        currentStep >=
        steps.length
    ) {

        finishWorkout();

        return;
    }


    loadStep();


    startTimer();

}


/* =========================================
   PROGRESS
========================================= */

function updateProgress() {

    const elapsed =
        totalSeconds
        -
        remainingWorkoutSeconds;


    const percent =
        Math.min(
            100,
            (
                elapsed /
                totalSeconds
            )
            *
            100
        );


    document.getElementById(
        "progressFill"
    ).style.width =
        percent + "%";


    document.getElementById(
        "remainingTime"
    ).textContent =

        formatTime(
            remainingWorkoutSeconds
        );
}


/* =========================================
   PAUSE
========================================= */

function togglePause() {

    paused =
        !paused;


    document.getElementById(
        "pauseButton"
    ).textContent =

        paused
        ? "Resume"
        : "Pause";

}


/* =========================================
   STOP
========================================= */

function stopWorkout() {

    clearInterval(timer);

    showHome();

}


/* =========================================
   FINISH
========================================= */

function finishWorkout() {

    clearInterval(timer);


    document.getElementById(
        "workoutScreen"
    ).style.display =
        "none";


    document.getElementById(
        "finishedScreen"
    ).style.display =
        "block";

}


/* =========================================
   HOME
========================================= */

function showHome() {

    clearInterval(timer);


    document.getElementById(
        "workoutScreen"
    ).style.display =
        "none";


    document.getElementById(
        "finishedScreen"
    ).style.display =
        "none";


    document.getElementById(
        "homeScreen"
    ).style.display =
        "block";


    renderWorkoutOptions();

    updateSelectedWorkout();

}


/* =========================================
   TIMER ANIMATION
========================================= */

function pulseTimer() {

    const circle =
        document.getElementById(
            "timerCircle"
        );


    circle.classList.add(
        "active"
    );


    setTimeout(
        function() {

            circle.classList.remove(
                "active"
            );

        },
        150
    );

}


/* =========================================
   INITIALIZE
========================================= */

renderWorkoutOptions();

updateSelectedWorkout();

</script>

</body>
